[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aitools-alerts"
version = "0.1.4"
description = "Security alerts for people running AI agents: verify, match and act on signed advisories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]
curator = ["websockets>=12"]

[project.scripts]
aitools-alerts = "aitools_alerts.cli:main"
aitools-alerts-poster = "aitools_alerts.poster.main:main"

[project.urls]
Homepage = "https://github.com/Joi/ai-tools-alerts"

[tool.setuptools]
# spec/ and trust/ stay at the repo root and ship inside the package as data,
# so an installed copy finds them beside the modules (aitools_alerts._data_dir).
packages = ["aitools_alerts", "aitools_alerts.poster", "aitools_alerts.spec", "aitools_alerts.trust"]

[tool.setuptools.package-dir]
"aitools_alerts.spec" = "spec"
"aitools_alerts.trust" = "trust"

[tool.setuptools.package-data]
"aitools_alerts.spec" = ["*.json"]
"aitools_alerts.trust" = ["*.json", "*.pub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# An exception in a worker thread (the fetch thread) fails the test, not just warns.
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
