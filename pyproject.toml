[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aitools-alerts"
version = "0.1.0"
description = "Security alerts for people running AI agents: verify, match and act on signed advisories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/Joi/ai-tools-alerts"

[tool.setuptools]
packages = ["aitools_alerts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
