# sshd Match block for the poster's put-only route (ai-tools-alerts#w75s, nfm3, vzc3):
# the feed checkpoint only; posts go to the relay over HTTPS.
# Appended at the end of the relay VM's sshd_config (a Match block runs to
# the end of the file or the next Match). Keep a backup, run `sshd -t`, and
# reload sshd only when it passes.
Match User aitools-poster
    AuthorizedKeysFile /home/aitools-poster/.ssh/authorized_keys
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
    AllowStreamLocalForwarding no
    DisableForwarding yes
    PermitUserRC no
