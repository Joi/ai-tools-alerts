# sshd Match block for the poster's send-only route (ai-tools-alerts#w75s).
# Appended at the end of the relay VM's sshd_config (a Match block runs to
# the end of the file or the next Match). Keep a backup, run `sshd -t`, and
# reload sshd only when it passes.
Match User aitools-poster
    AuthorizedKeysFile /home/aitools-poster/.ssh/authorized_keys
    AllowTcpForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
    PermitTunnel no
